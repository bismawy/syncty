name = "syntive"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding. Create it with:
#   npx wrangler d1 create syntive
# then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "syntive"
database_id = "82380a69-6796-41c3-b24a-76ef408f7d4e"
migrations_dir = "migrations"

# Apply migrations: npx wrangler d1 migrations apply syntive --remote
